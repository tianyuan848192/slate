<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="/assets/fonts/lib/dela-gothic-one.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0c0e; }
  #root {
    position: absolute; inset: 0; overflow: hidden;
    background: radial-gradient(ellipse at 50% 44%, #171a21 0%, #0b0c0e 72%);
  }
  .card {
    position: absolute; left: 10%; top: 16%; width: 80%; height: 58%;
    overflow: hidden; border: 1px solid rgba(247,248,250,0.12);
    border-radius: calc(var(--u) * 3);
    background: rgba(21,24,30,0.88);
    box-shadow: 0 calc(var(--u) * 5) calc(var(--u) * 11) rgba(0,0,0,0.46);
    display: flex; align-items: center; justify-content: center;
  }
  .headline {
    display: flex; gap: calc(var(--u) * 2.4); white-space: nowrap;
    font-family: "Dela Gothic One", sans-serif; font-weight: 400;
    font-size: calc(var(--u) * 12); line-height: 1; color: #f7f8fa;
    text-shadow: 0 calc(var(--u) * 0.8) calc(var(--u) * 3) rgba(0,0,0,0.52);
    opacity: 0;
  }
  .accent { color: #b895ff; }
</style>
</head>
<body>
<div id="root">
  <div class="card">
    <div class="headline" role="heading" aria-level="1"><span>让这一刻</span><span class="accent">算数</span></div>
  </div>
</div>
<script src="/skills/kit-motion/kit.js"></script>
<script src="/skills/kit-motion/headline-slam.js"></script>
<script>
  const root = document.getElementById('root');
  root.style.setProperty('--u', SLATE.u + 'px');
  SLATE.waits = SLATE.waits || [];
  SLATE.waits.push(document.fonts.load('400 60px "Dela Gothic One"'));
  const tl = SLATE.timeline();
  KIT.motions.headlineSlam(tl, root.querySelector('.headline'), { at: 0, dur: SLATE.duration || 3.5 });
  window.render = t => tl.at(t);
</script>
</body>
</html>
