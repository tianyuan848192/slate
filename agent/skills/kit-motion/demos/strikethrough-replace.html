<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="/assets/fonts/lib/noto-sans-jp.css" />
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f7f7f8; }
  #root { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: "Noto Sans JP", system-ui, sans-serif; color: #18181b; }
  .label { font-size: calc(var(--u) * 3.2); font-weight: 700; color: #71717a; letter-spacing: 0.2em; margin-bottom: calc(var(--u) * 4); }
  .pair { display: flex; align-items: center; gap: calc(var(--u) * 5); font-size: calc(var(--u) * 12); font-weight: 900; line-height: 1.2; }
  .pair strong { display: inline-block; font-weight: 900; }
</style>
</head>
<body>
<div id="root">
  <div class="label">上线周期</div>
  <div class="pair">
    <span class="old">三个月</span>
    <strong class="new">三天</strong>
  </div>
</div>
<script src="/skills/kit-motion/kit.js"></script>
<script src="/skills/kit-motion/strikethrough-replace.js"></script>
<script>
  const root = document.getElementById("root");
  root.style.setProperty("--u", SLATE.u + "px");
  SLATE.waits = SLATE.waits || [];
  SLATE.waits.push(document.fonts.load('900 60px "Noto Sans JP"'));
  const tl = SLATE.timeline();
  KIT.motions.strikethroughReplace(tl, root.querySelector(".old"), {
    at: 0.5,
    next: root.querySelector(".new"),
    origin: "left",
    thickness: "standard",
    tint: "red"
  });
  tl.set(root, { opacity: 1 }, 5);
  window.render = (t) => tl.at(t);
</script>
</body>
</html>
