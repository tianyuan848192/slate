<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="/assets/fonts/lib/noto-serif-sc.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0c0e; }
  #root {
    position: absolute; inset: 0; overflow: hidden;
    background: radial-gradient(ellipse at 50% 42%, #221f2c 0%, #0b0c0e 72%);
    font-family: "Noto Serif SC", serif; color: #f8fafc;
  }
  .card {
    position: absolute; left: 14%; right: 14%; top: 9%; height: 66%;
    border: 1px solid rgba(52,58,70,0.7); border-radius: calc(var(--u) * 3);
    background: rgba(20,23,28,0.78);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(var(--u) * 2);
  }
  .logo { width: 70%; height: 52%; }
  .logo svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .title { font-size: calc(var(--u) * 7); font-weight: 700; letter-spacing: 0.12em; opacity: 0; }
</style>
</head>
<body>
<div id="root">
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 1024 520" preserveAspectRatio="xMidYMid meet">
        <path d="M 170 378 L 330 132 L 458 330 L 584 132 L 830 378 L 680 378 L 584 248 L 508 378 L 408 378 L 330 248 L 252 378 Z" stroke-width="16" />
      </svg>
    </div>
    <div class="title">群山工作室</div>
  </div>
</div>
<script src="/skills/kit-motion/kit.js"></script>
<script src="/skills/kit-motion/svg-stroke-trace.js"></script>
<script>
  const root = document.getElementById('root');
  root.style.setProperty('--u', SLATE.u + 'px');
  SLATE.waits = SLATE.waits || [];
  SLATE.waits.push(document.fonts.load('700 60px "Noto Serif SC"'));

  const tl = SLATE.timeline();
  KIT.motions.svgStrokeTrace(tl, root.querySelector('.logo svg'), {
    at: 0.1, dur: 1.85, color: '#c5a3ff', hold: 1.5, exit: 'none'
  });
  const title = root.querySelector('.title');
  tl.tween(title, { opacity: [0, 1], y: [SLATE.u * 1.5, 0] }, { at: 1.3, dur: 0.7, ease: 'outCubic' });
  window.render = t => tl.at(t);
  render(0);
</script>
</body>
</html>
