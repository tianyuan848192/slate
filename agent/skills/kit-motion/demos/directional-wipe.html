<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="/assets/fonts/lib/noto-serif-sc.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f7f7f8; }
  .card {
    position: absolute; left: 19%; top: 16%; width: 62%; height: 58%;
    overflow: hidden; border-radius: calc(var(--u) * 2.6);
    background: #111827; box-shadow: 0 calc(var(--u) * 2.6) calc(var(--u) * 7.4) rgba(15,23,42,0.2);
  }
  .scene {
    position: absolute; inset: 0; display: flex; padding: calc(var(--u) * 7);
    font-family: "Noto Serif SC", serif; font-weight: 900; font-size: calc(var(--u) * 7.5);
    letter-spacing: 0.04em; color: #fff;
  }
  .scene span { line-height: 1.2; }
  .from {
    align-items: flex-start; justify-content: flex-start;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 4px), rgba(255,255,255,0.08);
  }
  .to {
    align-items: flex-end; justify-content: flex-end;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 4px), #2a3140;
  }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="scene from"><span>旧的一页</span></div>
  <div class="scene to"><span>翻开新篇章</span></div>
</div>
<script src="/skills/kit-motion/kit.js"></script>
<script src="/skills/kit-motion/directional-wipe.js"></script>
<script>
  document.documentElement.style.setProperty('--u', SLATE.u + 'px');
  SLATE.waits = SLATE.waits || [];
  SLATE.waits.push(document.fonts.load('900 80px "Noto Serif SC"'));
  const card = document.getElementById('card');
  const tl = SLATE.timeline();
  KIT.motions.directionalWipe(tl, [card.querySelector('.from'), card.querySelector('.to')], {
    at: 0.5, dur: 0.9, ring: '#38bdf8'
  });
  window.render = t => tl.at(t);
  window.render(0);
</script>
</body>
</html>
