<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="/assets/fonts/lib/noto-serif-sc.css" />
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0c0e;}
  #root{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vmin;padding-bottom:12vh;box-sizing:border-box;color:#f8fafc;font-family:"Noto Serif SC",serif;}
  .line{margin:0;font-weight:700;line-height:1.2;letter-spacing:0.02em;text-align:center;max-width:86vw;}
  .big{font-size:calc(var(--u) * 10);}
  .sub{font-size:calc(var(--u) * 5.5);color:#cbd5e1;font-weight:600;}
</style>
</head>
<body>
<div id="root">
  <p class="line big" id="t1">让每一帧都值得信赖</p>
  <p class="line sub" id="t2">渲染结果，零意外</p>
</div>
<script src="/skills/kit-motion/kit.js"></script>
<script src="/skills/kit-motion/marker-highlight.js"></script>
<script>
  document.documentElement.style.setProperty("--u", SLATE.u + "px");
  SLATE.waits = SLATE.waits || [];
  SLATE.waits.push(document.fonts.load('700 60px "Noto Serif SC"'));
  SLATE.waits.push(document.fonts.load('600 60px "Noto Serif SC"'));
  const root = document.getElementById("root");
  const tl = SLATE.timeline();
  KIT.motions.markerHighlight(tl, root.querySelector("#t1"), { at: 0, dur: 3.5, word: "值得信赖", style: "highlight", color: "green" });
  KIT.motions.markerHighlight(tl, root.querySelector("#t2"), { at: 0.25, dur: 3.25, word: "零意外", style: "circle", color: "violet", drawAt: 1.3 });
  window.render = t => tl.at(t);
</script>
</body>
</html>
