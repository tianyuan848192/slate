<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/assets/fonts/lib/noto-serif-sc.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #101418; font-family: "Noto Serif SC", serif; }
  #demo {
    position: absolute; inset: 0; overflow: hidden; color: #fff;
    background: radial-gradient(circle at 25% 20%, #3b5b7a 0, transparent 30%), linear-gradient(135deg, #101418, #20282f);
  }
  .wrap {
    position: absolute; left: 12%; right: 12%; top: 18%; bottom: 24%;
    display: flex; flex-direction: column; justify-content: center;
  }
  .eyebrow { color: #80d9ff; font-size: calc(var(--u) * 4); font-weight: 600; letter-spacing: 0.1em; }
  .title { margin-top: calc(var(--u) * 2.6); font-size: calc(var(--u) * 10); line-height: 1.15; font-weight: 900; }
  .copy { margin-top: calc(var(--u) * 3.6); max-width: calc(var(--u) * 90); color: #d7e3ea; font-size: calc(var(--u) * 4.2); line-height: 1.4; }
</style>
</head>
<body>
<div id="demo">
  <div class="wrap">
    <div class="eyebrow sbi">动效基础元件</div>
    <div class="title sbi">柔焦显现，自带电影感</div>
    <div class="copy sbi">适用于标题、标签、数据和场景开场。</div>
  </div>
</div>
<script src="/skills/kit-motion/kit.js"></script>
<script src="/skills/kit-motion/soft-blur-in.js"></script>
<script>
  const root = document.getElementById('demo');
  root.style.setProperty('--u', SLATE.u + 'px');
  SLATE.waits = SLATE.waits || [];
  SLATE.waits.push(document.fonts.load('900 60px "Noto Serif SC"'), document.fonts.load('600 40px "Noto Serif SC"'), document.fonts.load('400 40px "Noto Serif SC"'));
  const tl = SLATE.timeline();
  KIT.motions.softBlurIn(tl, root.querySelectorAll('.sbi'), { at: 0.35 });
  window.render = t => tl.at(t);
  window.render(0);
</script>
</body>
</html>
