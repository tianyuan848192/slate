<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="/assets/fonts/lib/noto-sans-jp.css" />
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse 70% 90% at 26% 30%, rgba(60,230,172,0.08) 0%, rgba(60,230,172,0) 60%),
      linear-gradient(160deg, #1a201d 0%, #121614 55%, #0e1210 100%);
    font-family: "Noto Sans JP", sans-serif;
  }
  #root { position: absolute; inset: 0; }
  .card {
    position: absolute; left: 50%; top: 12%;
    width: 72%; margin-left: -36%;
    box-sizing: border-box;
    background: #fdfdfd; border-radius: calc(var(--u) * 3);
    padding: calc(var(--u) * 3.6) calc(var(--u) * 4.4);
    box-shadow: 0 calc(var(--u) * 3) calc(var(--u) * 7) rgba(0,0,0,0.5);
  }
  .bubble {
    margin-left: auto; width: fit-content; max-width: 80%;
    background: #f0f0f0; color: #111;
    border-radius: calc(var(--u) * 3);
    padding: calc(var(--u) * 1.4) calc(var(--u) * 2.6);
    font-size: calc(var(--u) * 4); line-height: 1.4; font-weight: 500;
  }
  .answer {
    margin-top: calc(var(--u) * 3.4);
    font-size: calc(var(--u) * 4.6); line-height: 1.55; font-weight: 500;
    letter-spacing: 0.03em; color: #141414;
  }
</style>
</head>
<body>
<div id="root">
  <div class="card">
    <div class="bubble">怎样把我的网页变成真正的视频？</div>
    <div class="answer" id="answer">不需要视频剪辑软件。渲染器会把你已经写好的网页，逐帧变成像素级精确、每次都一样的视频。</div>
  </div>
</div>
<script src="/skills/kit-motion/kit.js"></script>
<script src="/skills/kit-motion/streaming-text.js"></script>
<script>
  const root = document.getElementById('root');
  root.style.setProperty('--u', SLATE.u + 'px');
  SLATE.waits = SLATE.waits || [];
  SLATE.waits.push(document.fonts.load('500 60px "Noto Sans JP"'));
  const tl = SLATE.timeline();
  KIT.motions.streamingText(tl, root.querySelector('#answer'), { at: 0.8, tone: 'dark-on-light' });
  tl.set(root, { opacity: 1 }, 5.5);
  window.render = (t) => tl.at(t);
</script>
</body>
</html>
