<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="/assets/fonts/lib/noto-serif-sc.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0c0e; }
  #root { position: absolute; inset: 0; overflow: hidden; background: #0b0c0e; }
  .card {
    position: absolute; left: 12%; width: 76%; top: 8%; height: 68%;
    overflow: hidden; border: 1px solid rgba(148,163,184,0.24);
    border-radius: calc(var(--u) * 3); background: #0b0c0e;
    box-shadow: 0 calc(var(--u) * 4) calc(var(--u) * 11) rgba(0,0,0,0.52);
  }
  .camera {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 48%, #5a6070 0%, #343b4d 27%, #0b0c0e 100%);
  }
  .camera::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 48%, transparent 24%, rgba(11,12,14,0.2) 58%, rgba(11,12,14,0.88) 100%);
  }
  .headline {
    position: relative; z-index: 1; max-width: 85%;
    color: #f8fafc; font-family: "Noto Serif SC", serif; font-weight: 700;
    font-size: calc(var(--u) * 12); line-height: 1.1; letter-spacing: 0.04em; text-align: center;
    text-shadow: 0 calc(var(--u) * 1) calc(var(--u) * 4) rgba(11,12,14,0.62);
  }
</style>
</head>
<body>
<div id="root">
  <div class="card">
    <div class="camera"><div class="headline">看得更近一些</div></div>
  </div>
</div>
<script src="/skills/kit-motion/kit.js"></script>
<script src="/skills/kit-motion/push-in.js"></script>
<script>
  const root = document.getElementById('root');
  root.style.setProperty('--u', SLATE.u + 'px');
  SLATE.waits = SLATE.waits || [];
  SLATE.waits.push(document.fonts.load('700 60px "Noto Serif SC"', '看得更近一些'));
  const tl = SLATE.timeline();
  KIT.motions.pushIn(tl, root.querySelector('.camera'), { at: 0, dur: SLATE.duration || 4, intensity: 'bold' });
  window.render = t => tl.at(t);
</script>
</body>
</html>
