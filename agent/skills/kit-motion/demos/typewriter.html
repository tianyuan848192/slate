<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="/assets/fonts/lib/jetbrains-mono.css" />
<link rel="stylesheet" href="/assets/fonts/lib/noto-serif-sc.css" />
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f7f8}
  #scene{position:absolute;left:0;right:0;top:0;height:78%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u) * 3)}
  .cmd{font:700 calc(var(--u) * 4.6)/1.2 "JetBrains Mono", ui-monospace, monospace;color:#52525b;letter-spacing:-0.02em;white-space:nowrap}
  .title{font:900 calc(var(--u) * 8.5)/1.25 "Noto Serif SC", serif;color:#18181b;text-align:center;max-width:86%}
</style>
</head>
<body>
<div id="scene">
  <div class="cmd" id="cmd">$ slate add typewriter</div>
  <div class="title" id="title">一字一句，敲出你的故事</div>
</div>
<script src="/skills/kit-motion/kit.js"></script>
<script src="/skills/kit-motion/typewriter.js"></script>
<script>
  document.documentElement.style.setProperty("--u", SLATE.u + "px");
  SLATE.waits = SLATE.waits || [];
  SLATE.waits.push(document.fonts.load('700 60px "JetBrains Mono"'));
  SLATE.waits.push(document.fonts.load('900 60px "Noto Serif SC"', '一字一句敲出你的故事'));

  const total = SLATE.duration || 5;
  const tl = SLATE.timeline();
  KIT.motions.typewriter(tl, document.getElementById("cmd"), { at: 0.3, dur: Math.min(2.12, total * 0.4), caret: "line" });
  KIT.motions.typewriter(tl, document.getElementById("title"), { at: Math.min(1.6, total * 0.3), dur: Math.min(2.6, total * 0.55), caret: "block", tone: "ink" });
  window.render = t => tl.at(t);
</script>
</body>
</html>
