<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="/assets/fonts/lib/noto-serif-sc.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0c0e; }
  #root {
    position: absolute; inset: 0; overflow: hidden;
    background: radial-gradient(ellipse at 50% 42%, #1f1d2a 0%, #0b0c0e 72%);
  }
  .card {
    position: absolute; left: 12%; top: 25%; width: 76%; height: 50%;
    border: 1px solid rgba(52,58,70,0.72); border-radius: 3vmin;
    background: #0b0c0e; box-shadow: 0 4vh 12vh rgba(11,12,14,0.68);
    display: flex; align-items: center; justify-content: center;
  }
  .title {
    font-family: "Noto Serif SC", serif; font-weight: 700;
    color: #c5a3ff; line-height: 1.1; text-align: center;
    max-width: 88%;
  }
</style>
</head>
<body>
<div id="root">
  <div class="card"><h1 class="title" id="title">每一帧都算数</h1></div>
</div>
<script src="/skills/kit-motion/kit.js"></script>
<script src="/skills/kit-motion/per-word-rise.js"></script>
<script>
  const u = SLATE.u;
  const title = document.getElementById('title');
  title.style.fontSize = (10 * u) + 'px';
  title.style.letterSpacing = (0.4 * u) + 'px';
  SLATE.waits = SLATE.waits || [];
  SLATE.waits.push(document.fonts.load('700 60px "Noto Serif SC"', '每一帧都算数'));
  const tl = SLATE.timeline();
  KIT.motions.perWordRise(tl, title, { at: 0.2, split: 'char', exit: 'up', hold: 1.2 });
  window.render = t => tl.at(t);
</script>
</body>
</html>
