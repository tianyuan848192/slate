<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/skills/papercut/style.css">
<script src="/skills/papercut/components.js"></script>
</head>
<body>
<script>
  // 产品节庆促销卡（7 秒）：窗格框贴上 → 礼盒一块块拼出来（金色丝带是全片唯一的金箔）→ 品名逐字贴上 → 卖点章弹出 → 盖印 → 一张红纸揭着盖过来，接下一镜
  const { seg: S1, u: U, width: W, height: H, safe } = SLATE;
  const { C, shape: SH, tr } = PC;
  const st = PC.stage({ ground: 'rice', exit: 'peel', zoom: [1.025, 1], kicks: [2.95] });
  const fr = PC.frame(st, { x: W / 2, y: safe.y + H * 0.36, w: W * 0.8, h: H * 0.7 });
  const box = fr.inner, bx = box.x + box.w * 0.29, by = box.y + box.h * 0.63;
  // 礼盒：盒身（丝带两侧各剪一朵梅）、盒盖、金丝带、蝴蝶结——都用 PC.piece 拼
  const body = PC.piece(st, { x: bx, y: by, shape: [SH.rect(U * 32, U * 22)], motif: PC.merge(PC.motif('plum', U * 9, -U * 9, U * 0.5), PC.motif('plum', U * 9, U * 9, U * 0.5)), inset: true, seed: 21 });
  const lid = PC.piece(st, { x: bx, y: by - U * 13.5, shape: [SH.rrect(U * 35, U * 6.5, U * 0.6)], holes: [-1, 1].map(s => tr(SH.diamond(U * 2.2, U * 1.6), s * U * 12, 0)), tone: C.deep, seed: 22 });
  const ribbon = PC.piece(st, { x: bx, y: by - U * 2.5, shape: [SH.rect(U * 4.2, U * 28.5)], tone: C.gold, seed: 23, shadow: true });
  // 蝴蝶结：两个圈（圈里剪空）+ 两条燕尾飘带 + 结
  const tail = s => [[s * U * 0.6, 0], [s * U * 2.4, 0], [s * U * 6.2, U * 5.6], [s * U * 4.6, U * 4.9], [s * U * 4.1, U * 6.6]];
  const bow = PC.piece(st, { x: bx, y: by - U * 18.2, enter: 'pop', tone: C.gold, seed: 24,
    shape: [tr(SH.petal(U * 8.4, U * 6, 0.45), 0, 0, -Math.PI + 0.62), tr(SH.petal(U * 8.4, U * 6, 0.45), 0, 0, -0.62), tail(-1), tail(1), SH.rrect(U * 3.4, U * 2.8, U * 0.8)],
    holes: [tr(SH.petal(U * 4.4, U * 2.4, 0.5), -U * 2.2, -U * 1.3, -Math.PI + 0.62), tr(SH.petal(U * 4.4, U * 2.4, 0.5), U * 2.2, -U * 1.3, -0.62)] });
  // 右边的文案
  const tx = box.x + box.w * 0.57;
  const ny = box.y + box.h * 0.42;
  const name = PC.heading(st, { text: '年货礼盒', x: tx, y: ny, size: U * 10, align: 'left', color: C.deep });
  const sl = PC.seal(st, { x: tx + U * 47, y: ny - U * 4.2, size: U * 6.4, text: '年礼' });   // 印章跟在题字后面
  const desc = PC.text(st, { x: tx, y: ny + U * 7, text: '坚果 · 茶点 · 糖果　八件装', size: U * 3.6, anchor: 'start', color: PC.ground.rice.text2 });
  const bd = PC.badge(st, { x: tx + U * 9, y: box.y + box.h * 0.76, r: U * 9, text: '8折', sub: '限时' });
  const date = PC.text(st, { x: tx + U * 21, y: box.y + box.h * 0.76 + U * 1.3, text: '1月10日—1月25日', size: U * 3.4, anchor: 'start', weight: 700 });
  const tag = PC.tag(st, { text: '示例品牌 · 示例价格' });

  function render(t) {
    st.set(t);
    fr.draw(PC.seg(t, 0.15, 0.75));
    body.draw(PC.seg(t, 0.7, 1.3));
    lid.draw(PC.seg(t, 0.85, 1.45));
    ribbon.draw(PC.seg(t, 1.0, 1.5), { sheen: S1(t, 3.9, 4.8, SLATE.ease.inOut) });
    bow.draw(PC.seg(t, 1.2, 1.75), { sheen: S1(t, 4.1, 5.0, SLATE.ease.inOut) });
    name.draw(PC.seg(t, 1.4, 2.2));
    desc.draw(PC.seg(t, 2.0, 2.4));
    bd.draw(PC.seg(t, 2.6, 3.0));
    date.draw(PC.seg(t, 3.2, 3.5));
    sl.draw(PC.seg(t, 3.6, 3.95));
    tag.draw(S1(t, 0.5, 0.9));
  }
</script>
</body>
</html>
