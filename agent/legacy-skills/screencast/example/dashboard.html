<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/skills/screencast/style.css">
<script src="/skills/screencast/components.js"></script>
</head>
<body>
<script>
  // 看板数据亮点（约 7 秒，深色界面）：看板整体浮现、指标滚动、趋势线画出 → 推近"复购率" → 聚光灯压暗其余部分 → 标注一句结论
  // 页面标题就是界面自己的标题（不另加大标题）；数字都是示例，做片时只用用户给的数据，并保留"示例数据"角标直到换成真数
  const { seg, u: U, ease } = SLATE;
  const st = SC.stage({ wall: 'night' });
  const tag = SC.mark(st.hud, { text: '示意界面 · 示例数据' });
  const fr = SC.frame(st.world, { kind: 'browser', theme: 'dark', ...SC.fit({ top: tag.bottom, aspect: 1.72 }), url: 'app.example.com/dashboard' });
  const side = SC.sidebar(fr, { brand: '示例工作台', active: 0, foot: '周宁', items: [
    { icon: 'home', label: '经营总览' }, { icon: 'chart', label: '报表' }, { icon: 'users', label: '客户', badge: 3 }, { icon: 'inbox', label: '订单' }, { icon: 'settings', label: '设置' },
  ] });
  const x0 = side.w + U * 3, mw = fr.bw - x0 - U * 3;
  SC.header(fr, { x: x0, y: U * 2.4, w: mw, title: '经营看板', sub: '数据更新于今天 10:30', actions: [
    { label: '近 30 天', kind: 'secondary', icon: 'calendar' }, { label: '导出', icon: 'download' },
  ] });
  const g = U * 1.6, kw = (mw - g * 3) / 4, ky = U * 10.4, kh = U * 13;
  const spark = n => Array.from({ length: 12 }, (_, i) => 40 + i * n + 8 * Math.sin(i * 1.3 + n));
  const kpis = [
    { label: '销售额', prefix: '¥', value: 128.6, digits: 1, unit: '万', delta: '↑ 8.2%', spark: spark(2) },
    { label: '订单数', value: 3482, unit: '单', delta: '↑ 5.1%', spark: spark(1.5) },
    { label: '客单价', prefix: '¥', value: 369, unit: '元', delta: '↑ 2.9%', spark: spark(0.8) },
    { label: '复购率', value: 32.4, digits: 1, unit: '%', delta: '↑ 12.4%', spark: spark(3.2) },
  ].map((k, i) => SC.kpi(fr, { ...k, x: x0 + i * (kw + g), y: ky, w: kw, h: kh }));
  const cy = ky + kh + g, ch = fr.bh - cy - U * 2.6, cw = mw * 0.64;
  const trend = SC.card(fr, { x: x0, y: cy, w: cw, h: ch, title: '销售趋势', sub: '万元 / 天' });
  const days = Array.from({ length: 30 }, (_, i) => { const d = new Date(Date.UTC(2026, 8, 13 + i)); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`; });
  const vals = days.map((_, i) => 3.2 + i * 0.05 + 0.7 * Math.sin(i * 0.55) + 0.35 * Math.sin(i * 1.7));
  const line = SC.chart(trend, { kind: 'area', x: U * 0.6, y: U * 5.2, w: cw - U * 2.4, h: ch - U * 6.4, data: vals, labels: days, every: 6, max: 6, ticks: 3, tick: v => v.toFixed(0) });
  const rank = SC.card(fr, { x: x0 + cw + g, y: cy, w: mw - cw - g, h: ch, title: '渠道占比' });
  const tb = SC.table(rank, { x: U * 0.6, y: U * 5.4, w: mw - cw - g - U * 1.2, rowH: U * 5.2, headH: U * 3.4, cols: [{ label: '渠道', w: 0.36 }, { label: '占比', w: 0.64 }], rows: [
    ['直播', { bar: 0.34, text: '34%' }], ['小程序', { bar: 0.27, text: '27%' }], ['官网', { bar: 0.19, text: '19%' }], ['门店', { bar: 0.13, text: '13%' }], ['分销', { bar: 0.07, text: '7%' }],
  ] });
  // 推近第 4 张指标卡（1.7 倍）；bound 让推近后满屏都是界面（卡片在窗口右上角，所以会偏右上），随后聚光灯 + 标注
  const hero = kpis[3];
  st.camera([{ t: 2.5, at: hero, zoom: 1.7 }], { bound: fr });
  const spot = SC.spotlight(st, { at: hero, pad: U * 1.2, dim: 0.6 });
  const note = SC.callout(st, { at: hero, side: 'bottom', text: '复购率提升 12.4%', tone: 'light', gap: U * 5 });

  function render(t) {
    st.set(t);
    fr.draw(SC.pop(t, 0.05));
    tag.draw(seg(t, 0.5, 1));
    side.select(0, 1);
    kpis.forEach((k, i) => k.draw(seg(t, 0.35 + i * 0.12, 1.75 + i * 0.12)));
    trend.draw(seg(t, 0.6, 1.2));
    line.draw(seg(t, 0.8, 2.3, ease.linear));
    rank.draw(seg(t, 0.75, 1.35));
    tb.draw(seg(t, 0.9, 2.0));
    spot.set(t, seg(t, 3.0, 3.5));
    note.set(t, seg(t, 3.3, 4.2));
  }
</script>
</body>
</html>
