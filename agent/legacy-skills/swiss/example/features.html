<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/skills/swiss/style.css">
<script src="/skills/swiss/components.js"></script>
</head>
<body>
<script>
  // 卖点三连（16:9，8 秒；示例数据，做片时换成用户给的、有依据的数字）
  //   0～1 秒 页面标题 → 0.9 / 2.0 / 3.1 秒 三个模块依次入场，大数字翻牌，信号色指针跟着点名的卖点走
  //   → 3.6 秒 脚注（数据的测得条件）→ 6 秒 指针回到第一项，收住这一镜
  const { u: U } = SLATE;
  const { lin } = SW;
  const st = SW.stage({ grid: true });      // 接在开场后面：网格已经在了，不再生长
  const G = st.G, w = st.world;

  const fo = SW.folio(st.hud, { items: [[0, 'HUSH 2'], [3, '头戴式降噪耳机'], [6, '卖点'], [11, '02 / 05', 'end']] });
  const hd = SW.heading(w, { index: '02', kicker: '为什么选它', text: '三个数字，讲清楚 HUSH 2' });
  const ls = SW.list(w, { y: G.y(2) - U * 2, layout: 'cols', size: U * 20, titleSize: U * 4.8, items: [
    { value: '48', unit: 'dB', title: '深度降噪', note: '地铁和机舱的低频轰鸣明显减弱' },
    { value: '40', unit: '小时', title: '长续航', note: '开着降噪，一周通勤一充' },
    { value: '5', unit: '分钟', title: '快充', note: '充 5 分钟，听 4 小时' },
  ] });
  const fn = SW.footnote(st.hud, { text: '示例数据，实验室环境测得', anchor: 'end' });

  // 三个卖点的入场时刻（对齐旁白点名的那一句）
  const at = [0.9, 2.0, 3.1];

  function render(t) {
    st.set(t);
    fo.draw(lin(t, 0, 0.6));
    hd.draw(lin(t, 0.1, 1.0));
    ls.items.forEach((it, i) => it.draw(lin(t, at[i], at[i] + 1.3)));
    // 指针：第一次出现时沿细线长出，之后在卖点之间滑动，最后回到第一项
    const q = SLATE.interpolate(t, [at[1], at[1] + 0.6, at[2], at[2] + 0.6, 6.0, 6.8], [0, 1, 1, 2, 2, 0], { easing: SW.E });
    ls.focus(t < at[0] + 0.2 ? -1 : q, lin(t, at[0] + 0.2, at[0] + 0.8));
    fn.draw(lin(t, 3.6, 4.2));
  }
</script>
</body>
</html>
