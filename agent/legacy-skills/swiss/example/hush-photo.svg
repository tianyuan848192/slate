<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <!-- 示例"产品照片"（带背景，相当于用户上传的棚拍照片 JPG）。只用于示例 -->
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFCBC3"/><stop offset="0.62" stop-color="#C2BEB5"/><stop offset="1" stop-color="#ADA89E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#E4E1DA" stop-opacity="0.9"/><stop offset="1" stop-color="#E4E1DA" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <g id="cup">
      <rect x="114" y="338" width="22" height="78" rx="3" fill="#A8A6A0"/>
      <rect x="114" y="338" width="6" height="78" fill="#C9C7C1"/>
      <rect x="106" y="402" width="38" height="24" rx="7" fill="#2A2A2A"/>
      <ellipse cx="168" cy="528" rx="38" ry="100" fill="#3A3835"/>
      <ellipse cx="174" cy="528" rx="22" ry="84" fill="#2C2A28"/>
      <ellipse cx="118" cy="528" rx="60" ry="106" fill="#1B1B1B"/>
      <ellipse cx="112" cy="528" rx="42" ry="82" fill="#242424"/>
      <path d="M 78 470 A 42 82 0 0 0 78 586" fill="none" stroke="#3A3A3A" stroke-width="5" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="1600" height="1200" fill="url(#sweep)"/>
  <rect width="1600" height="1200" fill="url(#glow)"/>
  <ellipse cx="800" cy="1018" rx="380" ry="34" fill="#6E6A62" opacity="0.55" filter="url(#soft)"/>
  <g transform="translate(380 70) scale(1.4)">
    <path d="M 125 352 C 116 136, 484 136, 475 352" fill="none" stroke="#1E1E1E" stroke-width="34"/>
    <path d="M 129 346 C 121 150, 479 150, 471 346" fill="none" stroke="#353535" stroke-width="4"/>
    <path d="M 152 336 C 148 182, 452 182, 448 336" fill="none" stroke="#3A3835" stroke-width="16"/>
    <use href="#cup"/>
    <use href="#cup" transform="translate(600 0) scale(-1 1)"/>
    <circle cx="470" cy="470" r="4.5" fill="#EDEDED"/>
  </g>
</svg>
