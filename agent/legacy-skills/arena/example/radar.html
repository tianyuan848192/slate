<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/skills/arena/style.css">
<script src="/skills/arena/components.js"></script>
</head>
<body>
<script>
  // 能力雷达：五位选手同时出现，再两两对比（同时只高亮两位）（示例数据）
  const { seg, u: U, width: W, height: H, safe } = SLATE;
  const st = NA.stage({ floor: true, zoom: [1.04, 1] });
  const w = st.world;
  const axes = ['数学', '代码', '推理', '中文', '长文本', '多模态', '工具调用'];
  const vals = [[92, 72, 90, 84, 80, 75, 82], [88, 79, 85, 80, 70, 82, 88], [86, 64, 80, 90, 85, 60, 70], [90, 74, 88, 83, 92, 70, 76], [80, 66, 75, 77, 72, 68, 64]];
  const series = vals.map((v, i) => ({ id: 'ABCDE'[i], name: '模型 ' + 'ABCDE'[i], values: v, color: NA.C.series[i] }));
  const t1 = NA.heading(w, { text: '七维能力雷达' });
  // 雷达图放在标题和字幕区之间：维度标签在半径外 16% 处，要留出位置
  const y0 = t1.bottom + U * 2, y1 = SLATE.captionZone.y - U * 2;
  const r = Math.min((y1 - y0) / 2 / 1.3, W * 0.2), cy = (y0 + y1) / 2;
  const rd = NA.radar(w, { cx: W * 0.42, cy, r, axes, series, max: 100 });
  const lg = NA.legend(w, { x: W * 0.74, y: cy - U * 10, items: series.map(s => ({ name: s.name, color: s.color })), dir: 'column', size: U * 2.6 });
  const note = NA.label(w, { x: W * 0.74, y: cy + U * 16, text: '先看全貌，再两两对比', size: U * 2.3, color: NA.C.muted });
  const src = NA.source(st.hud, { text: '示例数据，仅演示版式' });

  function render(t) {
    st.set(t);
    t1.draw(seg(t, 0.1, 0.9));
    rd.draw(seg(t, 0.4, 2.6));
    lg.draw(seg(t, 1.2, 2.2));
    note.draw(seg(t, 2.2, 2.8));
    // 3.2 秒起：A 对 D，5 秒起：B 对 C
    const f1 = seg(t, 3.2, 3.6) - seg(t, 4.8, 5.1), f2 = seg(t, 5.1, 5.5);
    if (t < 5.0) rd.focus(['A', 'D'], f1); else rd.focus(['B', 'C'], f2);
    src.draw(seg(t, 1, 1.5));
  }
</script>
</body>
</html>
