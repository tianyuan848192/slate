<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/skills/shanshui/style.css">
<script src="/skills/shanshui/components.js"></script>
</head>
<body>
<script>
  // 二十四节气讲解（8 秒）：标题 → 墨梅一枝从画外伸进来 → 立春三候从右往左逐列写出 → 钤印 → 结尾墨晕盖满画面，接下一镜（下一镜用 enter: 'wash'）。
  const { seg, u: U, width: W, height: H, ease } = SLATE;
  const st = SS.stage({ palette: 'shuimo', pan: [U * 3, -U * 3], zoom: [1, 1.025], exit: 'ink', exitAt: [0.24, 0.55], exitDur: 1.0 });
  const hills = SS.mountains(st, { layers: 3, kind: 'range', seed: 5, from: 0.6, to: 0.88, height: 0.75, depth: [0.3, 0.8] });
  const h1 = SS.heading(st.hud, { text: '二十四节气 · 立春', sub: '每年公历 2 月 3～5 日交节' });
  const branch = SS.plum(st.world, { x: -U * 4, y: H * 0.8, angle: -34, len: U * 68, w: U * 2.8, seed: 8, bloom: 1.15 });
  // 三候：每列上面一行小字（几候），下面四个大字；从右往左读
  const names = ['一候', '二候', '三候'], words = ['东风解冻', '蛰虫始振', '鱼陟负冰'];
  const x0 = W * 0.8, gap = U * 14, y0 = h1.bottom + U * 3;
  const cols = words.map((w, i) => {
    const x = x0 - i * gap;
    const tag = SS.inscription(st.hud, { x, y: y0, text: names[i], color: SS.C.muted });
    const big = SS.vtitle(st.hud, { x, y: tag.bottom + U * 1.5, text: w, size: U * 9 });
    return { tag, big };
  });
  const se = SS.seal(st.hud, { x: x0 - 2.85 * gap, y: cols[2].big.bottom - U * 4, text: '立春', size: U * 8 });

  function render(t) {
    st.set(t);
    hills.draw(seg(t, 0, 1.6));
    h1.draw(seg(t, 0.2, 1.4, ease.linear));
    branch.draw(seg(t, 0.6, 4.8, ease.linear));
    cols.forEach((c, i) => {
      const a = 1.5 + i * 1.0;
      c.tag.draw(seg(t, a, a + 0.4));
      c.big.draw(seg(t, a + 0.2, a + 1.3, ease.linear));
    });
    se.draw(seg(t, 5.2, 5.55));
  }
</script>
</body>
</html>
