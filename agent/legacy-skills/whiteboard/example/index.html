<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/skills/whiteboard/style.css">
<script src="/skills/whiteboard/components.js"></script>
</head>
<body>
<div class="wb-title" id="title">先检索，再回答</div>
<svg class="wb-canvas" id="c"></svg>
<script>
  // 白板示例：问题 → 知识库检索 → 带着资料交给模型
  const { seg, u: U, width: W, height: H } = SLATE;  // U = 短边的 1%
  document.getElementById('title').style.fontSize = U * 6 + 'px';
  const c = document.getElementById('c');
  const cy = H * 0.46;
  const q = WB.bubble(c, { x: W * 0.07, y: cy - U * 9, w: U * 40, h: U * 15, text: '报销额度是多少？' });
  const a1 = WB.arrow(c, { x1: W * 0.07 + U * 42, y1: cy - U * 1.5, x2: W * 0.43, y2: cy - U * 1.5 });
  const kb = WB.box(c, { x: W * 0.45, y: cy - U * 13, w: U * 34, h: U * 26 });
  const kbLabel = WB.text(c, { x: W * 0.45 + U * 17, y: cy - U * 17, text: '公司知识库', size: U * 3.6, anchor: 'middle' });
  const docs = WB.icon(c, 'docs', { x: W * 0.45 + U * 6, y: cy - U * 9, size: U * 18 });
  const look = WB.icon(c, 'search', { x: W * 0.45 + U * 19, y: cy - U * 1, size: U * 11, color: WB.C.red });
  const a2 = WB.arrow(c, { x1: W * 0.45 + U * 36, y1: cy - U * 1.5, x2: W * 0.77, y2: cy - U * 1.5 });
  const llm = WB.box(c, { x: W * 0.78, y: cy - U * 8, w: U * 26, h: U * 13, label: '大模型' });

  function render(t) {
    q.draw(seg(t, 0.2, 1.4));
    a1.draw(seg(t, 1.3, 1.9));
    kb.draw(seg(t, 1.8, 2.8));
    kbLabel.draw(seg(t, 2.4, 3.0));
    docs.draw(seg(t, 2.6, 3.8));
    look.draw(seg(t, 3.6, 4.6));
    a2.draw(seg(t, 4.8, 5.4));
    llm.draw(seg(t, 5.3, 6.3));
  }
</script>
</body>
</html>
